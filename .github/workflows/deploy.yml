name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:ts

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Copy the repository to the box
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy" \
            --exclude node_modules --exclude .git --exclude data --exclude dist-publish \
            --exclude docs/screens --exclude assets/placeholders --exclude .claude \
            --exclude deploy/.env \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/blackmaria/"
      - name: Rebuild and restart
        run: |
          ssh -i ~/.ssh/deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -e
            cd ~/blackmaria
            docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
            docker image prune -f >/dev/null
            for i in $(seq 1 30); do
              curl -fsS -k https://localhost/healthz >/dev/null 2>&1 && break
              sleep 2
            done
            docker compose -f deploy/docker-compose.yml --env-file deploy/.env ps
          '
